*{box-sizing:border-box} body{margin:0;min-width:320px}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}a{color:var(--blue)}.app{min-height:100vh;display:flex}.nav{width:250px;background:var(--nav);padding:24px 12px;color:white;position:sticky;top:0;height:100vh;flex-shrink:0;display:flex;flex-direction:column;gap:7px}.brand{display:flex;align-items:center;gap:11px;padding:7px 11px 22px;font-size:18px;font-weight:800}.brandlogo{border-radius:12px;background:#2dba92;color:#06281d;width:37px;height:37px;display:grid;place-items:center;font-size:21px}.nav button{width:100%;text-align:left;padding:12px 13px;border:none;border-radius:10px;color:#bbcadf;background:none;font-weight:650}.nav button.active,.nav button:hover{color:#fff;background:#20344e}.nav .foot{margin-top:auto;padding:12px;font-size:12px;color:#8ea4c0;line-height:1.5}.main{flex:1;min-width:0;padding:28px max(24px,calc((100vw - 1450px)/2));}.top{display:flex;justify-content:space-between;align-items:start;gap:16px;margin-bottom:24px}.eyebrow{text-transform:uppercase;letter-spacing:1.4px;color:#6b7c91;font-size:11px;font-weight:800}.title{font-size:clamp(24px,3vw,32px);font-weight:820;letter-spacing:-.8px;margin:3px 0 6px}.sub{color:var(--muted);font-size:14px;line-height:1.5}.monthbox{display:flex;align-items:center;gap:7px;background:white;border:1px solid var(--line);padding:5px;border-radius:12px;white-space:nowrap}.monthbox button{border:0;background:#f0f4f8;border-radius:8px;width:34px;height:34px;font-weight:800}.monthbox strong{font-size:13px;min-width:108px;text-align:center;text-transform:capitalize}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.stat{background:#fff;border:1px solid var(--line);padding:18px;border-radius:16px;min-height:128px}.stat .sname{color:#61748b;font-weight:650;font-size:12px}.stat .svalue{font-size:clamp(22px,2.3vw,29px);font-weight:820;letter-spacing:-.8px;margin:10px 0 5px;overflow-wrap:anywhere}.stat .shint{color:#7d8ba0;font-size:12px}.good{color:var(--green)!important}.warn{color:var(--yellow)!important}.danger{color:var(--red)!important}.two{display:grid;grid-template-columns:1.23fr 1fr;gap:16px;margin-top:17px}.panel{background:#fff;border:1px solid var(--line);padding:20px;border-radius:16px;min-width:0}.panel h2{font-size:17px;margin:0 0 5px}.panel .desc{font-size:12px;color:var(--muted);margin:0 0 18px;line-height:1.5}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:13px}.section-head h2{margin:0}.pbtn{border:0;background:#133c8d;color:white;border-radius:10px;padding:10px 15px;font-size:13px;font-weight:750}.pbtn.secondary{background:#eef4fd;color:#17469c}.pbtn.red{background:#fceef0;color:#b52739}.pbtn.ghost{background:#f1f4f8;color:#3d4c60}.pbtn.small{padding:7px 9px;font-size:12px}.toolbar{display:flex;flex-wrap:wrap;gap:9px;align-items:center}.alert{border:1px solid #dde7ee;background:#f6f9fb;padding:11px 13px;border-radius:11px;font-size:13px;color:#405265;line-height:1.45;margin:8px 0}.alert.danger{border-color:#ffc7cf;background:#fff1f3;color:#a42e3e!important}.alert.warn{border-color:#ffe4a2;background:#fff8e5;color:#946000!important}.alert.good{border-color:#bde9db;background:#ecfaf5;color:#08684f!important}.bartrack{background:#e9eff3;height:10px;overflow:hidden;border-radius:12px;margin:7px 0 9px}.bar{height:100%;border-radius:12px;background:var(--green);max-width:100%}.bar.warn{background:#e5a72b}.bar.danger{background:#de5460}.budgetitem{padding:12px 0;border-bottom:1px solid #edf1f5}.budgetitem:last-child{border:0}.budgetline{display:flex;justify-content:space-between;gap:12px;font-size:13px}.budgetline strong{font-size:13px}.fine{font-size:12px;color:#728096}.muted{color:var(--muted)}.figrow{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid #eef1f4;gap:12px;font-size:13px}.figrow:last-child{border:0}.figrow b{white-space:nowrap}.tag{display:inline-block;padding:4px 7px;border-radius:7px;font-size:11px;font-weight:700;background:#edf3fb;color:#335c85}.tag.project{background:#f0ebff;color:#6842b0}.tag.in{background:#e9f8f2;color:#147853}.tag.out{background:#fff0ee;color:#b14541}.tablewrap{overflow-x:auto}.table{width:100%;border-collapse:collapse;min-width:680px;font-size:13px}.table th{text-align:left;background:#f5f7fa;color:#66778b;font-size:11px;padding:12px 9px}.table td{border-bottom:1px solid #eff2f5;padding:12px 9px;vertical-align:middle}.table .actions{white-space:nowrap}.table button{border:0;background:#f0f4f9;padding:7px 9px;margin-right:4px;border-radius:7px;color:#2b4c73;font-size:12px}.table button.remove{color:#ae3945;background:#fdf0f2}.empty{padding:27px 11px;text-align:center;font-size:13px;color:#718096}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.field{display:flex;flex-direction:column;gap:6px;min-width:0}.field.wide{grid-column:1/-1}.field label{font-size:12px;color:#50617a;font-weight:750}.field input,.field select{width:100%;border-radius:10px;padding:11px 12px;border:1px solid #ccd7e2;background:white;color:#182a43;outline:none;min-height:42px}.field input:focus,.field select:focus{border-color:#4087d4;box-shadow:0 0 0 3px #d8eafd}.field small{font-size:11px;color:#718096}.formactions{grid-column:1/-1;display:flex;gap:10px;align-items:center;margin-top:2px;flex-wrap:wrap}.info{font-size:13px;color:#556679;line-height:1.6}.info strong{color:#17283f}.mono{font-variant-numeric:tabular-nums}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.step{background:#f3f7fa;border-radius:12px;padding:15px;font-size:13px;line-height:1.5}.step strong{display:block;margin-bottom:7px}.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}.tabs button{background:white;border:1px solid #dde5ed;border-radius:9px;padding:8px 11px;color:#436079;font-size:13px}.tabs button.active{background:#1b4b96;color:white;border-color:#1b4b96}.smallstat{border:1px solid #ebeff4;border-radius:12px;padding:14px}.smallstat .n{font-size:21px;font-weight:800;margin:6px 0 0}.listline{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.note{padding:9px 12px;border-left:3px solid #b6c7d9;background:#f6f8fb;color:#62738b;font-size:12px;line-height:1.5;margin:10px 0}.footer{font-size:11px;color:#8390a1;text-align:center;margin:24px 0}.mobilebar{display:none}details{border:1px solid #e4ebf2;padding:12px 15px;border-radius:10px}details summary{font-weight:700;cursor:pointer}textarea{font:inherit}.pvalue{font-variant-numeric:tabular-nums}
@media(max-width:1050px){.nav{width:210px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:1fr}.main{padding:23px}}
@media(max-width:720px){.app{display:block}.nav{width:100%;height:auto;position:fixed;bottom:0;top:auto;z-index:20;padding:5px 5px calc(5px + env(safe-area-inset-bottom));flex-direction:row;justify-content:space-around;gap:0;box-shadow:0 -3px 14px #10243c22}.nav .brand,.nav .foot{display:none}.nav button{padding:9px 1px;font-size:10px;text-align:center;border-radius:7px;width:auto;flex:1}.nav button span{display:block;font-size:19px;margin-bottom:2px}.main{padding:20px 12px 100px}.top{align-items:start;flex-direction:column;margin-bottom:18px}.grid{gap:9px}.stat{padding:13px;min-height:106px}.stat .svalue{font-size:22px}.stat .shint{font-size:10px}.panel{padding:15px;border-radius:13px}.formgrid{grid-template-columns:1fr}.steps{grid-template-columns:1fr}.title{font-size:25px}.toolbar{width:100%}.monthbox{align-self:stretch;justify-content:space-between}.monthbox strong{flex:1}}
@media(max-width:385px){.stat .svalue{font-size:18px}.nav button{font-size:9px}}

.cloudstatus{padding:10px 14px;margin-bottom:14px;border:1px solid #cde3ef;border-radius:11px;background:#eef8ff;color:#285276;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:12px;flex-wrap:wrap}
.cloudstatus.pending{background:#fff8e8;border-color:#f7deb0;color:#8d6300}.gate{max-width:600px;margin:55px auto}.gate .panel{padding:28px}.forecastcards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.forecard{border:1px solid #dce5ed;border-radius:12px;padding:15px}.forecard strong{font-size:21px;display:block;margin:9px 0}.codebox{width:100%;min-height:92px;border:1px solid #b7cbd9;border-radius:8px;padding:12px;font:12px/1.5 monospace;overflow-wrap:anywhere;resize:vertical}
@media(max-width:720px){.gate{margin:12px auto}.forecastcards{grid-template-columns:1fr}.cloudstatus{padding:10px}.nav{overflow-x:auto;justify-content:flex-start;scrollbar-width:none}.nav::-webkit-scrollbar{display:none}.nav button{flex:0 0 66px;min-width:66px;max-width:66px}}

<body><div class="app"><nav class="nav" id="nav"></nav><main class="main" id="main"></main></div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="cloud.js"></script>
<script>
'use strict';
const VERSION='2.0.0', KEY='mi-balance-pwa-v1';
const CATS=['Alimentación','Agua','Electricidad','Internet','Telefonía','Gas','Vivienda','Transporte','Medicina y salud','Educación','Hogar y limpieza','Entretenimiento','Seguros','Imprevistos','Otros'];
const defaultData=()=>({version:1,settings:{salary:0,savingGoal:0,openingCash:0,openingSavings:0,salaryPayDay:0},cards:[{id:'card-principal',name:'Tarjeta principal',opening:0,cut:15,pay:5}],budgets:Object.fromEntries(CATS.map(x=>[x,0])),projects:[],tx:[],planned:[]});
let D=defaultData(),screen='dashboard',viewMonth=today().slice(0,7),editing=null,filterType='todos',message='';
function load(){try{let a=JSON.parse(localStorage.getItem(KEY));if(a&&a.version===1&&Array.isArray(a.tx)&&Array.isArray(a.cards)&&Array.isArray(a.projects))return a;}catch(e){}return defaultData();}
function save(){if(!cloud||phase!=='ready'){alert('Inicia sesión y selecciona un hogar antes de guardar.');return}try{cloud.save(D)}catch(e){alert('No se pudo preparar la sincronización: '+e.message)}}
function money(n){return new Intl.NumberFormat('es-EC',{style:'currency',currency:'USD',minimumFractionDigits:2}).format(Math.round((Number(n)||0)*100)/100)}
function num(n){return Number(n)||0}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function today(){let d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function uuid(){return 'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function inMonth(t,m=viewMonth){return t.date.slice(0,7)===m}
function txMonth(){return D.tx.filter(t=>inMonth(t))}
function sum(a){return a.reduce((s,x)=>s+num(x),0)}
function signed(t){return t.type==='income'||t.type==='project_collection'||t.type==='savings_withdraw'?1:-1}
function pname(id){return (D.projects.find(p=>p.id===id)||{}).name||'(proyecto eliminado)'}
function cname(id){return (D.cards.find(p=>p.id===id)||{}).name||'(tarjeta eliminada)'}
function projectStat(id,cutoff='9999-12-31',exclude=''){let ts=D.tx.filter(t=>t.projectId===id&&t.date<=cutoff&&t.id!==exclude);let cost=sum(ts.filter(t=>t.type==='project_expense').map(t=>t.amount)),collected=sum(ts.filter(t=>t.type==='project_collection').map(t=>t.amount)),profitTaken=sum(ts.filter(t=>t.type==='project_profit').map(t=>t.amount));return {cost,collected,profitTaken,available:Math.max(0,collected-cost-profitTaken),net:collected-cost-profitTaken}}
function cardStat(id,cutoff='9999-12-31') {let card=D.cards.find(c=>c.id===id);if(!card)return{total:0,family:0,project:0,previous:0};let bills=[{amount:num(card.opening),origin:'previous'}];let tx=D.tx.filter(t=>t.date<=cutoff&&((t.method==='card'&&t.cardId===id&&['family_expense','project_expense'].includes(t.type))||(t.type==='card_payment'&&t.cardId===id))).sort((a,b)=>a.date.localeCompare(b.date)||a.id.localeCompare(b.id));for(let t of tx){if(t.type==='card_payment'){let left=t.amount;for(let b of bills){let sub=Math.min(left,b.amount);b.amount-=sub;left-=sub;if(left<.001)break}if(left>.001)bills.unshift({amount:-left,origin:'previous'});}else bills.push({amount:t.amount,origin:t.type==='project_expense'?'project':'family'})}let out={total:0,family:0,project:0,previous:0};for(let b of bills){out[b.origin]+=b.amount;out.total+=b.amount}return out}
function snapshot(m=viewMonth){let ts=D.tx.filter(t=>inMonth(t,m));let familyIncome=sum(ts.filter(t=>t.type==='income'||t.type==='project_profit').map(t=>t.amount));let familyExpense=sum(ts.filter(t=>t.type==='family_expense').map(t=>t.amount));let extra=sum(ts.filter(t=>t.type==='income'&&t.category!=='Sueldo').map(t=>t.amount));let salary=sum(ts.filter(t=>t.type==='income'&&t.category==='Sueldo').map(t=>t.amount));let savingsIn=sum(ts.filter(t=>t.type==='savings_deposit').map(t=>t.amount)),savingsOut=sum(ts.filter(t=>t.type==='savings_withdraw').map(t=>t.amount));let projectExpense=sum(ts.filter(t=>t.type==='project_expense').map(t=>t.amount));let projectCollected=sum(ts.filter(t=>t.type==='project_collection').map(t=>t.amount));let payments=sum(ts.filter(t=>t.type==='card_payment').map(t=>t.amount));return {familyIncome,familyExpense,net:familyIncome-familyExpense,extra,salary,savingsIn,savingsOut,projectExpense,projectCollected,payments}}
function totalSavings(){return num(D.settings.openingSavings)+sum(D.tx.filter(t=>t.type==='savings_deposit').map(t=>t.amount))-sum(D.tx.filter(t=>t.type==='savings_withdraw').map(t=>t.amount))}
function estimatedCash(){return num(D.settings.openingCash)+sum(D.tx.filter(t=>t.type==='income'||t.type==='project_collection'||t.type==='savings_withdraw').map(t=>t.amount))-sum(D.tx.filter(t=>((t.type==='family_expense'||t.type==='project_expense')&&t.method==='cash')||t.type==='card_payment'||t.type==='savings_deposit').map(t=>t.amount))}
function projectReserve(){return sum(D.projects.map(p=>projectStat(p.id).available))}
function debt(){return sum(D.cards.map(c=>cardStat(c.id).total))}
function availableEstimate(){return estimatedCash()-projectReserve()-debt()}
function daysMonth(m){let a=m.split('-').map(Number);return new Date(a[0],a[1],0).getDate()}
function budgetColor(p){return p>100?'danger':p>=80?'warn':'good'}
function fmtDate(x){try{let[a,b,c]=x.split('-');return `${c}/${b}/${a}`}catch{return x}}
function txtType(t){return ({income:'Ingreso familiar',family_expense:'Gasto familiar',project_expense:'Compra proyecto',project_collection:'Cobro proyecto',card_payment:'Pago de tarjeta',savings_deposit:'Aporte a ahorros',savings_withdraw:'Retiro de ahorros',project_profit:'Retiro de utilidad'})[t]||t}
function nav(){let items=[['dashboard','▦','Resumen'],['new','＋','Registrar'],['movements','≡','Movimientos'],['budgets','◉','Presupuestos'],['projects','◇','Proyectos'],['cards','▤','Tarjetas'],['forecast','↗','Flujo 90 días'],['settings','⚙','Ajustes']];document.getElementById('nav').innerHTML=`<div class="brand"><div class="brandlogo">↗</div><div>Mi Balance</div></div>${items.map(i=>`<button type="button" class="${screen===i[0]?'active':''}" onclick="goto('${i[0]}')"><span>${i[1]}</span> ${i[2]}</button>`).join('')}<div class="foot">HOGAR + PROYECTOS<br>Sin nube · Datos en este dispositivo · v${VERSION}</div>`}
function pageTop(title,sub,withMonth=true){let [y,mo]=viewMonth.split('-').map(Number);let monthName=new Intl.DateTimeFormat('es-EC',{month:'long',year:'numeric'}).format(new Date(y,mo-1,1));return `<div class="top"><div><div class="eyebrow">Finanzas personales</div><h1 class="title">${title}</h1><div class="sub">${sub}</div></div>${withMonth?`<div class="monthbox"><button onclick="moveMonth(-1)" aria-label="Mes anterior">‹</button><strong>${monthName}</strong><button onclick="moveMonth(1)" aria-label="Mes siguiente">›</button></div>`:''}</div>`}
function stat(label,value,hint,cls=''){return `<div class="stat"><div class="sname">${label}</div><div class="svalue mono ${cls}">${money(value)}</div><div class="shint">${hint}</div></div>`}
function progress(label,spent,limit){let pct=limit>0?100*spent/limit:0,c=budgetColor(pct);return `<div class="budgetitem"><div class="budgetline"><strong>${esc(label)}</strong><span class="mono ${limit>0?c:''}">${money(spent)} ${limit>0?' / '+money(limit):' / sin límite'}</span></div>${limit>0?`<div class="bartrack"><div class="bar ${c}" style="width:${Math.min(pct,100)}%"></div></div><div class="fine">${pct.toFixed(0)}% utilizado · ${pct>100?`Excedido en ${money(spent-limit)}`:`Restante ${money(limit-spent)}`}</div>`:'<div class="fine">Configura un máximo en Presupuestos para activar el semáforo.</div>'}</div>`}
function dashboard(){let a=snapshot(),limit=num(D.settings.salary)-num(D.settings.savingGoal),monthTx=txMonth(),topSpent=CATS.map(cat=>({cat,v:sum(monthTx.filter(t=>t.type==='family_expense'&&t.category===cat).map(t=>t.amount)),limit:num(D.budgets[cat])})).filter(x=>x.v>0||x.limit>0).sort((x,y)=>y.v-x.v).slice(0,6);let alerts=[];if(viewMonth===today().slice(0,7)&&D.tx.length){const fc=forecastModel();if(fc.minCon<0)alerts.push({kind:'danger',text:'Proyección de caja negativa dentro de los próximos 90 días sin contar cobros pendientes de clientes. Revisa el módulo Flujo 90 días.'})}if(D.settings.salary<=0)alerts.push({kind:'warn',text:'Configura el sueldo mensual de referencia para calcular tu presupuesto base. No se registra como cobro hasta que ingreses el sueldo.'});if(a.net<0)alerts.push({kind:'danger',text:`El resultado familiar del mes está en negativo (${money(a.net)}). No se incluyen las compras de proyectos ni los pagos de tarjeta como gasto duplicado.`});let exceeded=CATS.filter(x=>num(D.budgets[x])>0&&sum(monthTx.filter(t=>t.type==='family_expense'&&t.category===x).map(t=>t.amount))>num(D.budgets[x]));if(exceeded.length)alerts.push({kind:'danger',text:`Límites sobrepasados: ${exceeded.join(', ')}.`});let nearing=CATS.filter(x=>num(D.budgets[x])>0&&sum(monthTx.filter(t=>t.type==='family_expense'&&t.category===x).map(t=>t.amount))>=num(D.budgets[x])*.8&&!exceeded.includes(x));if(nearing.length)alerts.push({kind:'warn',text:`Cerca de los máximos: ${nearing.join(', ')}.`});if(availableEstimate()<0)alerts.push({kind:'danger',text:'El disponible prudente estimado es negativo después de descontar deuda de tarjetas y fondos comprometidos en proyectos.'});let lateProjects=D.projects.filter(p=>p.due&&p.due<today()&&num(p.value)>projectStat(p.id).collected);if(lateProjects.length)alerts.push({kind:'warn',text:`Cobros previstos vencidos: ${lateProjects.map(p=>p.name).join(', ')}. Revisa con el cliente y actualiza la fecha prevista.`});if(!D.tx.length)alerts.push({kind:'good',text:'Empieza ingresando tus saldos iniciales, sueldo de referencia y límites. Después registra gastos y cobros reales.'});let ctop=pageTop('Tu dinero, bajo control','Situación familiar del mes, tarjetas y proyectos sin mezclar los conceptos.');return `${ctop}<section class="grid">${stat('Ingresos familiares cobrados',a.familyIncome,`Sueldo ${money(a.salary)} · Otros/retirados ${money(a.familyIncome-a.salary)}`)}${stat('Gastos familiares',a.familyExpense,'Incluye compras domésticas con tarjeta','danger')}${stat('Balance del mes',a.net,'Ingresos reconocidos − gastos',a.net>=0?'good':'danger')}${stat('Ahorro real acumulado',totalSavings(),`Aportes netos del mes: ${money(a.savingsIn-a.savingsOut)}`,totalSavings()>=0?'good':'danger')}</section><div class="two"><section class="panel"><div class="section-head"><h2>Presupuesto familiar</h2><button class="pbtn secondary small" onclick="goto('budgets')">Ajustar límites</button></div><p class="desc">Presupuesto sugerido = sueldo fijo de referencia − meta de ahorro. Los extras no se presuponen.</p>${progress('Máximo global sugerido',a.familyExpense,Math.max(0,limit))}${topSpent.length?topSpent.map(x=>progress(x.cat,x.v,x.limit)).join(''):'<div class="empty">Aún no hay movimientos ni presupuestos por categoría.</div>'}</section><section class="panel"><h2>Liquidez y compromisos</h2><p class="desc">Estimaciones basadas en saldos iniciales y movimientos registrados; no son saldos bancarios sincronizados.</p><div class="figrow"><span>Efectivo en cuentas estimado</span><b>${money(estimatedCash())}</b></div><div class="figrow"><span>Deuda total de tarjetas</span><b class="danger">${money(debt())}</b></div><div class="figrow"><span>Fondos reservados de proyectos</span><b>${money(projectReserve())}</b></div><div class="figrow"><strong>Disponible prudente estimado</strong><b class="${availableEstimate()<0?'danger':'good'}">${money(availableEstimate())}</b></div><div class="note">El disponible prudente descuenta toda la deuda registrada de tarjetas y reserva el excedente cobrado de proyectos aún no asignado a utilidad familiar. Es una estimación conservadora, no una conciliación bancaria.</div><button class="pbtn secondary small" onclick="goto('projects')">Ver cartera de proyectos</button></section></div><div class="two"><section class="panel"><h2>Alertas del día</h2><p class="desc">Semáforo: verde debajo de 80%, amarillo desde 80% a 100%, rojo sobre 100%.</p>${alerts.length?alerts.map(a=>`<div class="alert ${a.kind}">${esc(a.text)}</div>`).join(''):'<div class="alert good">No hay límites excedidos ni alertas de resultado para el mes seleccionado.</div>'}<div class="figrow"><span>Ingreso fijo de referencia</span><b>${money(D.settings.salary)}</b></div><div class="figrow"><span>Meta mensual de ahorro</span><b>${money(D.settings.savingGoal)}</b></div>${D.settings.salary>0&&a.salary===0?`<button class="pbtn small" style="margin-top:12px" onclick="quickSalary()">Registrar sueldo cobrado este mes</button>`:''}</section><section class="panel"><div class="section-head"><h2>Últimos movimientos</h2><button class="pbtn secondary small" onclick="goto('movements')">Ver todos</button></div>${monthTx.length?monthTx.slice().sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id)).slice(0,6).map(t=>`<div class="figrow"><div><strong>${esc(t.category||txtType(t.type))}</strong><div class="fine">${fmtDate(t.date)} · ${txtType(t.type)}${t.projectId?' · '+esc(pname(t.projectId)):''}</div></div><b class="${['income','project_collection'].includes(t.type)?'good':''}">${money(t.amount)}</b></div>`).join(''):'<div class="empty">Sin movimientos este mes.</div>'}</section></div>`}
function field(label,id,content,wide=false,help=''){return `<div class="field ${wide?'wide':''}"><label for="${id}">${label}</label>${content}${help?`<small>${help}</small>`:''}</div>`}
function select(id,options,value='',required=true){return `<select id="${id}" ${required?'required':''}>${options.map(o=>`<option value="${esc(o[0])}" ${String(o[0])===String(value)?'selected':''}>${esc(o[1])}</option>`).join('')}</select>`}
function newPage(){let t=D.tx.find(x=>x.id===editing);let type=t?.type||'family_expense';let typeChoices=[['family_expense','Gasto familiar'],['income','Ingreso familiar'],['project_expense','Compra / costo de proyecto'],['project_collection','Cobro de cliente (proyecto)'],['project_profit','Transferir utilidad al hogar'],['card_payment','Pago de tarjeta'],['savings_deposit','Aporte a ahorro'],['savings_withdraw','Retiro de ahorro']];return `${pageTop(t?'Editar movimiento':'Nuevo movimiento','Registra una sola vez cada hecho: la compra con tarjeta sí cuenta como gasto; el pago posterior de tarjeta no.',false)}<div class="two"><section class="panel"><form onsubmit="submitTx(event)" class="formgrid" id="txform">${field('Tipo de movimiento','f-type',select('f-type',typeChoices,type),true)}${field('Fecha','f-date',`<input id="f-date" type="date" required value="${t?.date||today()}">`)}${field('Importe (USD)','f-amount',`<input id="f-amount" type="number" min="0.01" step="0.01" inputmode="decimal" required value="${t?.amount??''}" placeholder="0.00">`)}<div class="field" id="f-category-wrap"></div><div class="field" id="f-method-wrap"></div><div class="field" id="f-card-wrap"></div><div class="field" id="f-project-wrap"></div>${field('Detalle / comprobante (opcional)','f-note',`<input id="f-note" maxlength="150" value="${esc(t?.note||'')}" placeholder="Ej. pago de materiales, factura 012">`,true)}<div class="formactions"><button class="pbtn" type="submit">${t?'Guardar cambios':'Registrar movimiento'}</button>${t?'<button class="pbtn ghost" type="button" onclick="cancelEdit()">Cancelar edición</button>':''}</div></form></section><section class="panel"><h2>Cómo registrar correctamente</h2><p class="desc">Recomendaciones para que tu balance no se distorsione.</p><div class="step"><strong>1. Compraste materiales para una obra con tarjeta</strong> Registra <b>Compra / costo de proyecto</b>, el proyecto y la tarjeta. No afecta el presupuesto doméstico; sí aumenta la deuda de la tarjeta.</div><div class="step" style="margin-top:10px"><strong>2. Pagaste la tarjeta desde el banco</strong> Registra <b>Pago de tarjeta</b>. Disminuye banco y deuda, pero no vuelve a ser gasto del mes.</div><div class="step" style="margin-top:10px"><strong>3. El cliente pagó uno o dos meses después</strong> Registra <b>Cobro de cliente</b>. El cobro queda en proyectos. Después puedes transferir solo la <b>utilidad disponible</b> a tu hogar.</div><div class="alert warn" style="margin-top:17px">Primero crea tus proyectos y tarjetas en sus secciones. Las utilidades no se registran automáticamente como sueldo.</div></section></div>`}
function syncTxFields(existing){let type=document.getElementById('f-type').value, old=existing||{};let exp=['family_expense','project_expense'].includes(type),pr=['project_expense','project_collection','project_profit'].includes(type),card=type==='card_payment';let catOptions=type==='family_expense'?CATS.map(x=>[x,x]):[['Sueldo','Sueldo'],['Extra personal','Extra personal'],['Otros ingresos','Otros ingresos']];let showCat=['family_expense','income'].includes(type);document.getElementById('f-category-wrap').innerHTML=showCat?`<label for="f-category">${type==='income'?'Tipo de ingreso':'Categoría de gasto'}</label>${select('f-category',catOptions,old.category||catOptions[0][0])}`:'';document.getElementById('f-method-wrap').innerHTML=exp?`<label for="f-method">Medio de pago</label>${select('f-method',[['cash','Efectivo / banco'],['card','Tarjeta de crédito']],old.method||'cash')}`:'';document.getElementById('f-card-wrap').innerHTML=(card||(exp&&document.getElementById('f-method')?.value==='card'))?`<label for="f-card">Tarjeta</label>${select('f-card',D.cards.map(c=>[c.id,c.name]),old.cardId||D.cards[0]?.id)}`:'';document.getElementById('f-project-wrap').innerHTML=pr?`<label for="f-project">Proyecto</label>${D.projects.length?select('f-project',D.projects.map(p=>[p.id,p.name]),old.projectId||D.projects[0].id):'<div class="alert warn">Crea un proyecto antes de registrar este movimiento.</div>'}`:'';if(document.getElementById('f-method'))document.getElementById('f-method').onchange=()=>syncTxFields({category:document.getElementById('f-category')?.value||'',method:document.getElementById('f-method').value,cardId:document.getElementById('f-card')?.value,projectId:document.getElementById('f-project')?.value})}
function submitTx(e){e.preventDefault();let type=document.getElementById('f-type').value,date=document.getElementById('f-date').value,amount=Number(document.getElementById('f-amount').value),category=document.getElementById('f-category')?.value||'',method=document.getElementById('f-method')?.value||'',cardId=document.getElementById('f-card')?.value||'',projectId=document.getElementById('f-project')?.value||'',note=document.getElementById('f-note').value.trim();if(!date||!Number.isFinite(amount)||amount<=0){alert('Indica una fecha válida y un valor positivo.');return}if(['project_expense','project_collection','project_profit'].includes(type)&&!D.projects.some(p=>p.id===projectId)){alert('Primero crea o selecciona un proyecto.');return}if((type==='card_payment'||method==='card')&&!D.cards.some(c=>c.id===cardId)){alert('Primero configura una tarjeta.');return}if(type==='project_profit'){let avail=projectStat(projectId,date,editing||'').available;if(amount>avail+.001){alert(`La utilidad transferible hasta la fecha es ${money(avail)}. Primero registra los cobros y costos del proyecto; no puedes retirar como ingreso doméstico más que la utilidad ya cobrada.`);return}}let oldTx=D.tx.find(x=>x.id===editing);let t={id:editing||uuid(),date,type,amount:Math.round(amount*100)/100,category,method,cardId,projectId,note,registeredBy:oldTx?.registeredBy||cloud?.user?.email||'',updatedBy:cloud?.user?.email||''};let i=D.tx.findIndex(x=>x.id===editing);if(i<0)D.tx.push(t);else D.tx[i]=t;save();editing=null;goto('movements');toast('Movimiento guardado correctamente')}
function movements(){let ts=txMonth().filter(t=>filterType==='todos'||t.type===filterType).sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id));let ops=[['todos','Todos'],['family_expense','Gastos familiares'],['income','Ingresos'],['project_expense','Compras de proyectos'],['project_collection','Cobros de proyectos'],['card_payment','Pagos de tarjetas'],['project_profit','Utilidades'],['savings_deposit','Ahorros']];return `${pageTop('Movimientos','Historial por mes. Puedes editar o eliminar operaciones y descargar un reporte CSV.')}<section class="panel"><div class="section-head"><h2>Registro mensual (${ts.length})</h2><div class="toolbar"><button class="pbtn secondary small" onclick="csvMonth()">Exportar CSV</button><button class="pbtn small" onclick="goto('new')">+ Agregar</button></div></div><div class="tabs">${ops.map(o=>`<button class="${filterType===o[0]?'active':''}" onclick="setFilter('${o[0]}')">${o[1]}</button>`).join('')}</div><div class="tablewrap"><table class="table"><thead><tr><th>Fecha</th><th>Operación</th><th>Detalle</th><th>Registrado por</th><th>Medio</th><th>Importe</th><th>Acciones</th></tr></thead><tbody>${ts.map(t=>`<tr><td>${fmtDate(t.date)}</td><td><span class="tag ${t.type.includes('project')?'project':['income','savings_withdraw'].includes(t.type)?'in':'out'}">${txtType(t.type)}</span></td><td><b>${esc(t.category||t.note||'—')}</b><div class="fine">${t.projectId?esc(pname(t.projectId))+' · ':''}${t.category?esc(t.note):''}</div></td><td>${esc(t.registeredBy||'—')}</td><td>${t.method==='card'?esc(cname(t.cardId)):t.type==='card_payment'?esc(cname(t.cardId)):t.method==='cash'?'Banco/efectivo':'—'}</td><td class="mono"><b>${money(t.amount)}</b></td><td class="actions"><button onclick="editTx('${t.id}')">Editar</button><button class="remove" onclick="deleteTx('${t.id}')">Eliminar</button></td></tr>`).join('')||'<tr><td colspan="7"><div class="empty">No hay movimientos con este filtro.</div></td></tr>'}</tbody></table></div></section>`}
function budgetsPage(){let a=snapshot();let totalLimits=sum(CATS.map(c=>D.budgets[c]));return `${pageTop('Presupuestos y semáforos','Límites por categoría para un mes; el color se actualiza al registrar cada compra familiar.')}<div class="grid">${stat('Sueldo presupuestado',D.settings.salary,'Base fija, no es un cobro')}${stat('Meta de ahorro',D.settings.savingGoal,'Objetivo separado del gasto')}${stat('Máximos asignados',totalLimits,'Suma de los límites por categorías')}${stat('Gastos del mes',a.familyExpense,'Incluye compras familiares con tarjeta',a.familyExpense>totalLimits&&totalLimits>0?'danger':'')}</div><div class="two"><section class="panel"><h2>Editar límites mensuales</h2><p class="desc">Un límite en $0 significa «sin presupuesto configurado» y no se clasifica con semáforo.</p><form id="budgetsform" class="formgrid" onsubmit="saveBudgets(event)">${CATS.map((cat,i)=>field(esc(cat),'budget-'+i,`<input type="number" step="0.01" min="0" id="budget-${i}" inputmode="decimal" value="${num(D.budgets[cat])}">`)).join('')}<div class="formactions"><button class="pbtn" type="submit">Guardar límites</button></div></form></section><section class="panel"><h2>Consumo vs. presupuesto</h2><p class="desc">Verde: menos de 80%. Amarillo: 80–100%. Rojo: más de 100%.</p>${CATS.filter(x=>num(D.budgets[x])>0||txMonth().some(t=>t.type==='family_expense'&&t.category===x)).map(x=>progress(x,sum(txMonth().filter(t=>t.type==='family_expense'&&t.category===x).map(t=>t.amount)),num(D.budgets[x]))).join('')||'<div class="empty">Configura tus límites para ver el semáforo.</div>'}<div class="note">Compara tus máximos asignados (${money(totalLimits)}) con lo que podrías destinar a gastos partiendo de tu sueldo y ahorro objetivo (${money(Math.max(0,num(D.settings.salary)-num(D.settings.savingGoal)))}).</div></section></div>`}
function projectsPage(){return `${pageTop('Proyectos y dinero por cobrar','Separa costos de obra, anticipos en tarjeta, cobros y retiro de utilidades.',false)}<section class="panel"><div class="section-head"><h2>Agregar proyecto</h2></div><form class="formgrid" onsubmit="addProject(event)">${field('Nombre del proyecto','pr-name','<input id="pr-name" required maxlength="70" placeholder="Ej. Tablero de automatización">')}${field('Cliente (opcional)','pr-client','<input id="pr-client" maxlength="70" placeholder="Empresa o cliente">')}${field('Importe total estimado por cobrar (USD)','pr-value','<input id="pr-value" type="number" min="0" step="0.01" inputmode="decimal" value="0">',false,'Valor de contrato/venta; no es ingreso cobrado.')}${field('Fecha prevista del cobro (opcional)','pr-due','<input id="pr-due" type="date">',false,'Servirá para alertarte si existen valores pendientes pasada la fecha.')}<div class="formactions"><button type="submit" class="pbtn">Crear proyecto</button></div></form></section><section class="panel" style="margin-top:16px"><div class="section-head"><h2>Cartera de proyectos</h2><button class="pbtn secondary small" onclick="goto('new')">Registrar compra o cobro</button></div><div class="tablewrap"><table class="table"><thead><tr><th>Proyecto</th><th>Valor esperado</th><th>Cobro previsto</th><th>Compras / costos</th><th>Cobrado</th><th>Falta cobrar*</th><th>Utilidad transferible</th><th>Acciones</th></tr></thead><tbody>${D.projects.map(p=>{let s=projectStat(p.id);return `<tr><td><b>${esc(p.name)}</b><div class="fine">${esc(p.client||'Sin cliente')}</div></td><td>${money(p.value)}</td><td>${p.due?fmtDate(p.due):'—'}</td><td>${money(s.cost)}</td><td class="good">${money(s.collected)}</td><td>${money(Math.max(0,num(p.value)-s.collected))}</td><td class="${s.available>0?'good':''}">${money(s.available)}</td><td class="actions"><button onclick="editProject('${p.id}')">Editar</button><button class="remove" onclick="deleteProject('${p.id}')">Eliminar</button></td></tr>`}).join('')||'<tr><td colspan="8"><div class="empty">Crea tu primer proyecto para separar gastos y cobros.</div></td></tr>'}</tbody></table></div><div class="note">* Falta cobrar = importe de referencia − cobros; no verifica facturas ni fechas de vencimiento. La utilidad transferible = cobros − costos registrados − utilidad ya retirada, si es positiva. No incluye automáticamente impuestos, garantías ni otros costos no ingresados.</div></section>`}
function cardsPage(){return `${pageTop('Tarjetas de crédito','Controla la deuda y distingue el consumo familiar del financiamiento de proyectos.',false)}<section class="panel"><h2>Agregar tarjeta</h2><p class="desc">El saldo inicial debe ser la deuda al comenzar a registrar movimientos en esta aplicación.</p><form class="formgrid" onsubmit="addCard(event)">${field('Nombre identificador','card-name','<input id="card-name" required maxlength="65" placeholder="Ej. Visa principal">')}${field('Deuda inicial (USD)','card-opening','<input id="card-opening" type="number" min="0" step="0.01" inputmode="decimal" value="0">')}${field('Día de corte','card-cut','<input id="card-cut" type="number" min="1" max="31" value="15">')}${field('Día de pago (informativo)','card-pay','<input id="card-pay" type="number" min="1" max="31" value="5">')}<div class="formactions"><button type="submit" class="pbtn">Crear tarjeta</button></div></form></section><section class="panel" style="margin-top:16px"><div class="section-head"><h2>Estado de tarjetas (acumulado)</h2><button class="pbtn secondary small" onclick="goto('new')">Registrar pago</button></div><div class="tablewrap"><table class="table"><thead><tr><th>Tarjeta</th><th>Deuda total*</th><th>Origen hogar</th><th>Origen proyecto</th><th>Saldo inicial sin clasificar</th><th>Corte / pago</th><th>Acciones</th></tr></thead><tbody>${D.cards.map(c=>{let s=cardStat(c.id);return `<tr><td><b>${esc(c.name)}</b></td><td><b class="${s.total>0?'danger':''}">${money(s.total)}</b></td><td>${money(s.family)}</td><td>${money(s.project)}</td><td>${money(s.previous)}</td><td>${c.cut} / ${c.pay}</td><td class="actions"><button onclick="editCard('${c.id}')">Editar</button><button class="remove" onclick="deleteCard('${c.id}')">Eliminar</button></td></tr>`}).join('')}</tbody></table></div><div class="note">* Se estima con saldo inicial + compras a crédito − pagos registrados. Los pagos se aplican a compras antiguas primero (FIFO) para identificar su origen; el reparto real del banco puede ser distinto. No se estiman intereses, comisiones, pagos mínimos ni cuotas diferidas. Verifica los estados de cuenta.</div></section>`}
function settingsPage(){let s=D.settings;return `${pageTop('Configuración y respaldos','Define tu base familiar, saldos de arranque y conserva una copia de tu información.',false)}<div class="two"><section class="panel"><h2>Parámetros económicos</h2><p class="desc">Registra valores reales. El sueldo de referencia sirve para planificar, no se sumará a ingresos hasta registrarse el cobro.</p><form class="formgrid" onsubmit="saveSettings(event)">${field('Sueldo fijo mensual neto (USD)','set-salary',`<input id="set-salary" type="number" step="0.01" min="0" inputmode="decimal" value="${s.salary}">`)}${field('Meta de ahorro mensual (USD)','set-goal',`<input id="set-goal" type="number" step="0.01" min="0" inputmode="decimal" value="${s.savingGoal}">`)}${field('Efectivo/bancos inicial (USD)','set-cash',`<input id="set-cash" type="number" step="0.01" inputmode="decimal" value="${s.openingCash}">`,false,'Todos los fondos líquidos que seguirás en esta aplicación, sin cuentas de ahorros.')}${field('Día habitual de pago de sueldo (1–31, 0 = desactivado)','set-payday',`<input id="set-payday" type="number" min="0" max="31" value="${s.salaryPayDay||0}">`,false,'Solo para proyección; no genera ingresos reales.')}${field('Saldo inicial de ahorros (USD)','set-savings',`<input id="set-savings" type="number" min="0" step="0.01" inputmode="decimal" value="${s.openingSavings}">`,false,'Los aportes/retiros posteriores se registran como transferencias, no como gastos.') }<div class="formactions"><button class="pbtn">Guardar configuración</button></div></form><div class="note">Los saldos iniciales deben corresponder al día desde el cual registrarás TODOS tus movimientos. Si faltan compras o pagos, las estimaciones de liquidez no coincidirán con el banco.</div></section><section class="panel"><h2>Seguridad de tus datos</h2><p class="desc">Los movimientos se almacenan en la nube y se comparten con las cuentas autorizadas. Exporta respaldos JSON periódicos.</p><div class="figrow"><span>Movimientos registrados</span><b>${D.tx.length}</b></div><div class="figrow"><span>Proyectos creados</span><b>${D.projects.length}</b></div><div class="figrow"><span>Tarjetas registradas</span><b>${D.cards.length}</b></div><div class="toolbar" style="margin-top:16px"><button class="pbtn" onclick="exportBackup()">Descargar respaldo JSON</button><button class="pbtn secondary" onclick="document.getElementById('import-file').click()">Importar respaldo (hogar nuevo)</button><input type="file" id="import-file" accept="application/json,.json" style="display:none" onchange="importBackup(event)"></div><div class="alert warn" style="margin-top:20px">Ambos dispositivos comparten la misma base de datos con conexión a internet. El respaldo JSON permite recuperar datos ante eliminaciones o fallos. No hay conexión automática a bancos.</div><button class="pbtn ghost small" style="margin-top:15px" onclick="logoutCloud()">Cerrar sesión</button></section></div><section class="panel" style="margin-top:16px"><h2>Acceso familiar y respaldo</h2><p class="desc">Ambos utilizan cuentas distintas pero comparten el mismo hogar.</p><div class="toolbar"><button class="pbtn" onclick="createCloudInvite()">Generar invitación para mi esposa/o</button><button class="pbtn secondary" onclick="importPreviousLocal()">Importar datos de versión anterior</button><button class="pbtn ghost" onclick="retryCloud()">Reintentar sincronización</button></div><div id="invite-display"></div></section><div class="panel" style="margin-top:16px"><h2>Reglas contables de la aplicación</h2><div class="steps"><div class="step"><strong>Gasto familiar</strong> Se reconoce al comprar, incluso si utilizas tarjeta de crédito. Pagar posteriormente la tarjeta es cancelar deuda, no generar otro gasto.</div><div class="step"><strong>Proyectos</strong> El costo de materiales o servicios se registra como proyecto y nunca como gasto doméstico. Los cobros se mantienen en el proyecto hasta transferir la utilidad disponible.</div><div class="step"><strong>Ahorros y saldo de caja</strong> Mover dinero hacia ahorros no es gasto. «Disponible prudente» descuenta de la caja estimada la deuda de tarjetas y la reserva contable de proyectos.</div></div></div>`}
function cashAsOf(cutoff){const ts=D.tx.filter(t=>t.date<=cutoff);return num(D.settings.openingCash)+sum(ts.filter(t=>['income','project_collection','savings_withdraw'].includes(t.type)).map(t=>t.amount))-sum(ts.filter(t=>((t.type==='family_expense'||t.type==='project_expense')&&t.method==='cash')||t.type==='card_payment'||t.type==='savings_deposit').map(t=>t.amount))}
function isoOffset(date,days){const d=new Date(date+'T12:00:00');d.setDate(d.getDate()+days);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function dayInMonth(year,month,day){return `${year}-${String(month).padStart(2,'0')}-${String(Math.min(day,new Date(year,month,0).getDate())).padStart(2,'0')}`}
function forecastModel(){const start=today(),currentCash=cashAsOf(start),dueCard=new Map();for(const card of D.cards){const amount=Math.max(0,cardStat(card.id,start).total);if(amount<=0)continue;const y=Number(start.slice(0,4)),m=Number(start.slice(5,7));let due=dayInMonth(y,m,num(card.pay)||5);if(due<start){const d=new Date(y,m,1);due=dayInMonth(d.getFullYear(),d.getMonth()+1,num(card.pay)||5)}dueCard.set(due,(dueCard.get(due)||0)+amount)}
const salaryDates=new Map();const payday=num(D.settings.salaryPayDay),salary=num(D.settings.salary);
if(payday>0&&salary>0){for(let mo=0;mo<=4;mo++){let d=new Date(Number(start.slice(0,4)),Number(start.slice(5,7))-1+mo,1);let year=d.getFullYear(),month=d.getMonth()+1,date=dayInMonth(year,month,payday);let already=D.tx.some(t=>t.type==='income'&&t.category==='Sueldo'&&t.date.slice(0,7)===date.slice(0,7));if(date>=start&&!already)salaryDates.set(date,salary)}}
const projectDates=new Map();for(const p of D.projects){if(!p.due||p.due<start)continue;const alreadyPlanned=D.planned.some(x=>x.projectId===p.id&&x.direction==='in');if(alreadyPlanned)continue;const paid=sum(D.tx.filter(t=>t.projectId===p.id&&t.type==='project_collection'&&t.date<=start).map(t=>t.amount));const expected=Math.max(0,num(p.value)-paid);if(expected>0)projectDates.set(p.due,(projectDates.get(p.due)||0)+expected)}
let conservative=currentCash,withCollections=currentCash,minCon=currentCash,minOpt=currentCash;const points=[],budTotal=sum(Object.values(D.budgets));
for(let i=0;i<=90;i++){const date=isoOffset(start,i);const yyyy=Number(date.slice(0,4)),mm=Number(date.slice(5,7));const dailyBudget=budTotal/daysMonth(date.slice(0,7));
  const manual=sum(D.planned.filter(p=>p.date===date).map(p=>p.direction==='in'?num(p.amount):-num(p.amount)));
  const event=manual+(salaryDates.get(date)||0)-(dueCard.get(date)||0)-dailyBudget;
  conservative+=event;withCollections+=event+(projectDates.get(date)||0);minCon=Math.min(minCon,conservative);minOpt=Math.min(minOpt,withCollections);
  if([29,59,89].includes(i))points.push({days:i+1,date,conservative,withCollections});}
return {currentCash,points,minCon,minOpt,budTotal,cardDue:sum([...dueCard.values()]),plannedDue:sum([...projectDates.values()]),salaryActive:payday>0};}
function forecastPage(){const x=forecastModel();const cols=x.points.map(p=>`<div class="forecard"><span class="fine">A ${p.days} días · ${fmtDate(p.date)}</span><strong class="${p.conservative<0?'danger':p.conservative<x.budTotal?'warn':'good'}">${money(p.conservative)}</strong><div class="fine">Sin cobros pendientes de clientes</div><div class="figrow"><span>Con cobros estimados</span><b class="${p.withCollections<0?'danger':'good'}">${money(p.withCollections)}</b></div></div>`).join('');let planned=(D.planned||[]).slice().sort((a,b)=>a.date.localeCompare(b.date));
return `${pageTop('Proyección de liquidez','Calcula el efectivo probable para los próximos 30, 60 y 90 días, incluyendo gastos previstos, tarjetas y cobros por proyecto.',false)}<div class="grid">${stat('Caja actual estimada',x.currentCash,'Según movimientos hasta hoy')}${stat('Presupuesto mensual',x.budTotal,'Se proyecta distribuido por día')}${stat('Deuda de tarjeta prevista',x.cardDue,'Se supone pago total próximo vencimiento')}${stat('Clientes por cobrar',x.plannedDue,'Escenario optimista, no garantizado')}</div><section class="panel" style="margin-top:17px"><h2>Evolución prevista de caja</h2><p class="desc">Proyección conservadora y escenario con cobros de proyectos. El color rojo señala caja negativa; el amarillo, margen menor a un mes de presupuesto.</p><div class="forecastcards">${cols}</div>${x.minCon<0?'<div class="alert danger">Atención: en la proyección conservadora aparece un saldo negativo. Evalúa adelantar cobros, mover pagos o reducir gastos.</div>':x.minCon<x.budTotal?'<div class="alert warn">El saldo proyectado tiene poco margen de seguridad. Revisa los vencimientos.</div>':'<div class="alert good">La proyección conservadora no entra en negativo durante el periodo calculado.</div>'}<div class="note">Supuestos: solo se proyecta sueldo si configuras su día de pago en Ajustes; los presupuestos mensuales se distribuyen diariamente como egresos de efectivo; se estima el pago total de la deuda de tarjeta en el próximo vencimiento. No se simulan nuevas compras a crédito, intereses, impuestos ni costos futuros de proyectos salvo que los ingreses como compromisos. Los cobros de clientes son inciertos y se muestran por separado. No sustituye el estado de cuenta bancario.</div></section><section class="panel" style="margin-top:16px"><h2>Agregar cobro o compromiso futuro</h2><p class="desc">Son eventos para el pronóstico: NO se contabilizan como gasto o ingreso real hasta que los registres en Movimientos.</p><form class="formgrid" onsubmit="addPlanned(event)">${field('Fecha prevista','pl-date',`<input type="date" id="pl-date" value="${today()}" required>`)}${field('Monto USD','pl-amount','<input type="number" id="pl-amount" min="0.01" step="0.01" required>')}${field('Movimiento estimado','pl-dir',select('pl-dir',[['out','Pago futuro'],['in','Ingreso futuro']]))}${field('Área','pl-area',select('pl-area',[['hogar','Hogar'],['proyecto','Proyecto']]))}${field('Descripción','pl-note','<input id="pl-note" maxlength="120" placeholder="Ej. Matrícula escolar, proveedor, préstamo" required>',true)}<div class="formactions"><button class="pbtn">Guardar compromiso</button></div></form></section><section class="panel" style="margin-top:16px"><h2>Compromisos programados (${planned.length})</h2><div class="tablewrap"><table class="table"><thead><tr><th>Fecha</th><th>Descripción</th><th>Área</th><th>Entrada / salida</th><th></th></tr></thead><tbody>${planned.map(p=>`<tr><td>${fmtDate(p.date)}</td><td>${esc(p.note)}</td><td>${esc(p.area)}</td><td class="${p.direction==='in'?'good':'danger'}">${p.direction==='in'?'+':'−'} ${money(p.amount)}</td><td><button class="pbtn red small" onclick="removePlanned('${p.id}')">Eliminar</button></td></tr>`).join('')||'<tr><td colspan="5">No hay compromisos programados.</td></tr>'}</tbody></table></div></section>`}
function addPlanned(e){e.preventDefault();const date=document.getElementById('pl-date').value,amount=Number(document.getElementById('pl-amount').value),direction=document.getElementById('pl-dir').value,area=document.getElementById('pl-area').value,note=document.getElementById('pl-note').value.trim();if(!date||!Number.isFinite(amount)||amount<=0||!note)return;D.planned.push({id:uuid(),date,amount:Math.round(amount*100)/100,direction,area,note,projectId:''});save();toast('Compromiso previsto registrado')}
function removePlanned(id){if(!confirm('¿Eliminar este compromiso futuro?'))return;D.planned=D.planned.filter(p=>p.id!==id);save();render()}

function render(){if(phase!=='ready')return renderGate();nav();let main=document.getElementById('main');main.innerHTML=screen==='dashboard'?dashboard():screen==='new'?newPage():screen==='movements'?movements():screen==='budgets'?budgetsPage():screen==='projects'?projectsPage():screen==='cards'?cardsPage():screen==='forecast'?forecastPage():settingsPage();if(screen==='new'){let t=D.tx.find(x=>x.id===editing)||null;syncTxFields(t);document.getElementById('f-type').onchange=()=>syncTxFields({});}addCloudStatus();if(message){let old=document.getElementById('toast');if(old)old.remove();let el=document.createElement('div');el.id='toast';el.textContent=message;el.style='position:fixed;right:16px;top:16px;z-index:99;background:#133c8d;color:white;padding:13px 19px;border-radius:10px;box-shadow:0 4px 16px #0002';document.body.appendChild(el);message='';setTimeout(()=>el.remove(),2500)}}
function toast(t){message=t;render()}
function goto(s){screen=s;if(s!=='new')editing=null;render();window.scrollTo({top:0,behavior:'instant'})}
function moveMonth(n){let [y,m]=viewMonth.split('-').map(Number);let d=new Date(y,m-1+n,1);viewMonth=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;render()}
function quickSalary(){if(D.settings.salary<=0)return;let date=viewMonth===today().slice(0,7)?today():viewMonth+'-01';if(!confirm(`¿Registrar ${money(D.settings.salary)} como sueldo COBRADO del mes ${viewMonth}? Se sumará a ingresos reales.`))return;D.tx.push({id:uuid(),date,type:'income',amount:D.settings.salary,category:'Sueldo',method:'',cardId:'',projectId:'',note:'Sueldo registrado desde resumen',registeredBy:cloud?.user?.email||'',updatedBy:cloud?.user?.email||''});save();toast('Sueldo registrado')}

function saveBudgets(e){e.preventDefault();CATS.forEach((c,i)=>D.budgets[c]=Math.max(0,Number(document.getElementById('budget-'+i).value)||0));save();toast('Presupuestos actualizados')}
function saveSettings(e){e.preventDefault();D.settings.salary=Math.max(0,num(document.getElementById('set-salary').value));D.settings.savingGoal=Math.max(0,num(document.getElementById('set-goal').value));D.settings.openingCash=num(document.getElementById('set-cash').value);D.settings.openingSavings=Math.max(0,num(document.getElementById('set-savings').value));D.settings.salaryPayDay=Math.max(0,Math.min(31,Math.floor(num(document.getElementById('set-payday').value))));save();toast('Configuración guardada')}
function addProject(e){e.preventDefault();let name=document.getElementById('pr-name').value.trim(),client=document.getElementById('pr-client').value.trim(),value=Math.max(0,num(document.getElementById('pr-value').value));if(!name)return;D.projects.push({id:uuid(),name,client,value,due:document.getElementById('pr-due').value||''});save();toast('Proyecto creado')}
function editProject(id){let p=D.projects.find(x=>x.id===id);if(!p)return;let name=prompt('Nombre del proyecto:',p.name);if(name===null)return;if(!name.trim())return;let client=prompt('Cliente:',p.client);if(client===null)return;let value=prompt('Valor total esperado por cobrar (USD):',p.value);if(value===null)return;if(!Number.isFinite(Number(value))||Number(value)<0){alert('Importe inválido');return}p.name=name.trim();p.client=client.trim();p.value=Number(value);let due=prompt('Fecha prevista de cobro (AAAA-MM-DD) o vacío:',p.due||'');if(due===null)return;if(due&&!/^\d{4}-\d{2}-\d{2}$/.test(due)){alert('Fecha no válida; utiliza AAAA-MM-DD.');return}p.due=due;save();toast('Proyecto actualizado')}
function deleteProject(id){if(D.tx.some(t=>t.projectId===id)){alert('No puedes eliminar un proyecto con movimientos. Corrige o elimina sus movimientos antes.');return}if(!confirm('¿Eliminar este proyecto?'))return;D.projects=D.projects.filter(x=>x.id!==id);save();render()}
function addCard(e){e.preventDefault();let name=document.getElementById('card-name').value.trim();if(!name)return;D.cards.push({id:uuid(),name,opening:Math.max(0,num(document.getElementById('card-opening').value)),cut:Math.max(1,Math.min(31,num(document.getElementById('card-cut').value))),pay:Math.max(1,Math.min(31,num(document.getElementById('card-pay').value)))});save();toast('Tarjeta agregada')}
function editCard(id){let c=D.cards.find(x=>x.id===id);if(!c)return;let name=prompt('Identificador de tarjeta:',c.name);if(name===null||!name.trim())return;let opening=prompt('Deuda al comenzar a registrar movimientos:',c.opening);if(opening===null)return;if(!Number.isFinite(Number(opening))||Number(opening)<0){alert('Deuda inválida');return}let cut=prompt('Día de corte (1-31):',c.cut);if(cut===null)return;let pay=prompt('Día de pago (1-31):',c.pay);if(pay===null)return;let ca=Number(cut),pa=Number(pay);if(!(Number.isInteger(ca)&&Number.isInteger(pa)&&ca>=1&&pa>=1&&ca<=31&&pa<=31)){alert('Días inválidos');return}Object.assign(c,{name:name.trim(),opening:Number(opening),cut:ca,pay:pa});save();toast('Tarjeta actualizada')}
function deleteCard(id){if(D.tx.some(t=>t.cardId===id)){alert('No se puede eliminar una tarjeta con movimientos relacionados.');return}if(D.cards.length<=1){alert('Mantén al menos una tarjeta de referencia.');return}if(!confirm('¿Eliminar tarjeta?'))return;D.cards=D.cards.filter(x=>x.id!==id);save();render()}
function download(name,content,mime){let blob=new Blob([content],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}
function exportBackup(){download('mi-balance-respaldo-'+today()+'.json',JSON.stringify({...D,exportDate:new Date().toISOString()},null,2),'application/json');}
function importBackup(e){let file=e.target.files?.[0];if(!file)return;let reader=new FileReader();reader.onload=()=>{try{let a=JSON.parse(reader.result);if(a.version!==1||!Array.isArray(a.tx)||!Array.isArray(a.cards)||!Array.isArray(a.projects)||!a.settings||typeof a.budgets!=='object')throw Error('El archivo no corresponde a un respaldo válido de Mi Balance v1.');if(!confirm(`El respaldo tiene ${a.tx.length} movimientos. ¿Importar los registros a este hogar NUEVO?`))return;cloud.importBackup(a).then(()=>toast('Respaldo importado y sincronizado')).catch(err=>alert('No se pudo importar: '+err.message))}catch(err){alert('No se pudo importar: '+err.message)}};reader.readAsText(file);e.target.value=''}

let cfg=window.MI_BALANCE_CONFIG||{};if(!cfg.url||!cfg.key){try{cfg=JSON.parse(localStorage.getItem('mi-balance-nube-config')||'{}')}catch{cfg={}}}
if(!cfg.url||!cfg.key){phase='setup';render();return}
cloud=new MiBalanceCloud(cfg,{phase:p=>{phase=p;render()},data:d=>{D=d;if(phase==='ready'&&!['new','settings','budgets','projects','cards','forecast'].includes(screen))render()},status:s=>{syncInfo=s;if(phase==='ready'){let old=document.querySelector('.cloudstatus');if(old)old.outerHTML=cloudStatusMarkup()}},error:e=>console.warn('Sincronización pendiente:',e)});
await cloud.initialize();}catch(e){phase='setup';gateNotice='No fue posible conectar: '+e.message;render()}}
function saveCloudCredentials(e){e.preventDefault();const url=document.getElementById('cloud-url').value.trim(),key=document.getElementById('cloud-key').value.trim();if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(url)){alert('Verifica el Project URL de Supabase.');return}if(key.length<20){alert('Clave pública incompleta.');return}localStorage.setItem('mi-balance-nube-config',JSON.stringify({url,key}));gateNotice='';void startCloud()}
async function submitAuth(e){e.preventDefault();const email=document.getElementById('user-email').value.trim(),password=document.getElementById('user-password').value;phase='loading';render();try{if(authMode==='signup'){gateNotice=await cloud.signup(email,password);if(phase==='loading'){phase='auth';authMode='login';render()}}else{await cloud.signin(email,password)}}catch(e){phase='auth';setGateError(e)}}
async function createHome(e){e.preventDefault();const name=document.getElementById('home-name').value.trim();phase='loading';render();try{await cloud.createHousehold(name)}catch(e){phase='household';setGateError(e)}}
async function joinHome(e){e.preventDefault();const token=document.getElementById('home-invite').value.trim();phase='loading';render();try{await cloud.joinHousehold(token)}catch(e){phase='household';setGateError(e)}}
async function createCloudInvite(){try{invitation=await cloud.newInvite();render();const el=document.getElementById('invite-display');if(el)el.innerHTML=`<div class="alert good">Código válido por 7 días y solo para una persona. Compártelo por un canal privado. La otra persona debe crear su propia cuenta y seleccionar <b>Unirme al mismo hogar</b>.</div><textarea class="codebox" id="invite-text" readonly>${esc(invitation)}</textarea><button class="pbtn secondary small" onclick="copyInvite()">Copiar código</button>`}catch(e){alert('No se pudo crear invitación: '+e.message)}}
async function copyInvite(){try{await navigator.clipboard.writeText(invitation);alert('Código copiado')}catch{document.getElementById('invite-text').select();alert('Selecciona y copia el código de arriba')}}
async function logoutCloud(){if(!cloud)return;try{await cloud.signout();D=defaultData();invitation='';syncInfo={label:'',pending:0};render()}catch(e){alert(e.message)}}
async function retryCloud(){if(!cloud)return;await cloud.flush();await cloud.pull();render()}
async function importPreviousLocal(){const s=localStorage.getItem(KEY);if(!s){alert('No se encontraron registros locales antiguos en este navegador. También puedes importar un respaldo JSON desde Ajustes.');return}try{const a=JSON.parse(s);if(!confirm(`Se encontraron ${a.tx?.length||0} movimientos en la versión anterior. ¿Importarlos a este hogar nuevo?`))return;await cloud.importBackup(a);toast('Historial anterior migrado a la nube')}catch(e){alert('Error al migrar: '+e.message)}}
window.addEventListener('online',()=>{if(cloud?.household)void retryCloud()});

render();void startCloud();if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
